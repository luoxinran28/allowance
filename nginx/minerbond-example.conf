# ========================================
# MinerBond Nginx 配置
# ========================================

# 全局代理通用配置
upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:4000;
}

# HTTP 服务器 - 重定向到 HTTPS (只监听8.218.151.90)
server {
    listen 8.218.151.90:80;
    server_name minerbond.com www.minerbond.com;

    # 日志配置
    access_log /var/log/nginx/minerbond_http_access.log;
    error_log /var/log/nginx/minerbond_http_error.log;

    # Let's Encrypt 验证路径（如果使用 certbot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 重定向所有 HTTP 流量到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务器 - 主配置 (只监听8.218.151.90)
server {
    listen 8.218.151.90:443 ssl http2;
    server_name minerbond.com www.minerbond.com;

    # SSL 证书配置
    ssl_certificate /ssl/minerbond.pem;
    ssl_certificate_key /ssl/minerbond.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' data: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://mineru.net https://api.deepseek.com https://cdn.jsdelivr.net data:; worker-src 'self' blob: https://cdn.jsdelivr.net; frame-ancestors 'none';" always;

    # 日志配置
    access_log /var/log/nginx/minerbond_ssl_access.log;
    error_log /var/log/nginx/minerbond_ssl_error.log;

    # 全局代理配置
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_http_version 1.1;

    # Docker DNS 解析器
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 10s;

    # 大文件上传配置
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # ========================================
    # API 服务路由
    # ========================================
    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # 健康检查端点
    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    # ========================================
    # 静态文件服务
    # ========================================
    
    # 上传文件目录（用户上传的图片等）
    location ^~ /uploads/ {
        alias /var/www/minerbond/uploads/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, immutable";
        access_log off;
    }

    # Next.js 构建资源（带哈希的静态文件）
    location /_next/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # 强缓存（Next.js 静态资源带有内容哈希）
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 通用静态文件（图片、字体、CSS、JS 等）
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, immutable";
        access_log off;
    }

    # PDF.js 库文件（特殊处理）
    location ^~ /libs/pdfjs-5.4.296-dist/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # ========================================
    # 前端服务（Next.js SSR）
    # ========================================
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}