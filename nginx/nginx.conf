# ========================================
# Allowance Authorization System
# Nginx Reverse Proxy Configuration (Docker Deployment)
# ========================================
# Server: 47.79.78.229 (Allowance)
# Purpose: Reverse proxy for Docker container services
#          Also serves as IdP for KwongFu at 47.82.64.35
# Usage: Used in docker-compose.prod.yml
# Configuration: Frontend on client:3030, Backend on server:4040
# ========================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Upstream servers (Docker containers)
    upstream allowance_backend {
        server server:4040;
    }

    upstream allowance_frontend {
        server client:3030;
    }

    # ========================================
    # Allowance Service (Host Deployment)
    # ========================================
    server {
        listen 80;
        server_name 47.79.78.229 allowance.local _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # API endpoints (/api/*)
        # Strip /api prefix before proxying to backend
        # Example: /api/auth/login → /auth/login
        location /api/ {
            # Rate limiting for API
            limit_req zone=api burst=20 nodelay;

            # Disable any default CORS headers from nginx
            add_header Access-Control-Allow-Origin "" always;
            add_header Access-Control-Allow-Methods "" always;
            add_header Access-Control-Allow-Headers "" always;
            add_header Access-Control-Allow-Credentials "" always;
            add_header access-control-allow-origin "" always;
            add_header access-control-expose-headers "" always;

            # Rewrite to strip /api prefix, then proxy to backend
            rewrite ^/api/(.*) /$1 break;

            # Proxy to backend
            proxy_pass http://allowance_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ========================================
        # Auth/User routes
        # ========================================
        location ~ ^/(auth|user)/ {
            # Set upstream based on content type
            if ($http_accept ~ "text/html") {
                set $upstream allowance_frontend;
            }
            if ($http_accept !~ "text/html") {
                set $upstream allowance_backend;
            }

            # Rate limiting for auth endpoints
            limit_req zone=auth burst=10 nodelay;

            # Proxy to the determined upstream
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # pgAdmin access (/pgadmin/*)
        # pgAdmin is configured with SCRIPT_NAME=/pgadmin so it generates correct URLs
        location /pgadmin/ {
            # Proxy directly to pgAdmin - no rewrite needed since SCRIPT_NAME handles path
            proxy_pass http://pgadmin:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /pgadmin;

            # pgAdmin specific settings
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Frontend (all other requests)
        location / {
            # Proxy to frontend
            proxy_pass http://allowance_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Frontend specific settings
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "Allowance service is healthy\n";
            add_header Content-Type text/plain;
        }

        # Default location for root path
        location = / {
            proxy_pass http://allowance_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ========================================
    # HTTPS Redirect for Allowance (47.79.78.229)
