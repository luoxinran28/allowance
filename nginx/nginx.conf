# ========================================
# Allowance Authorization System
# Nginx Reverse Proxy Configuration (Docker Deployment)
# ========================================
# Purpose: Reverse proxy for Docker container services
# Usage: Used in docker-compose.prod.yml
# Configuration: Frontend on client:3030, Backend on server:4040
# ========================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Upstream servers (Docker containers)
    upstream allowance_backend {
        server server:4040;
    }

    upstream allowance_frontend {
        server client:3030;
    }

    # ========================================
    # Allowance Service (Host Deployment)
    # ========================================
    server {
        listen 80;
        server_name _;  # Accept any hostname

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # API endpoints (/api/*)
        location /api/ {
            # Rate limiting for API
            limit_req zone=api burst=20 nodelay;

            # Proxy to backend
            proxy_pass http://allowance_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # pgAdmin access (/admin/*)
        location /admin/ {
            # Rewrite path to remove /admin prefix before proxying
            rewrite ^/admin/(.*) /$1 break;
            
            # Proxy to pgAdmin
            proxy_pass http://pgadmin:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Rewrite redirects to include /admin prefix
            proxy_redirect http://pgadmin:80/ http://$host/admin/;
            proxy_redirect / /admin/;

            # Rewrite response URLs to include /admin prefix
            sub_filter_types text/html text/css text/javascript application/javascript application/json;
            sub_filter 'href="/' 'href="/admin/';
            sub_filter 'src="/' 'src="/admin/';
            sub_filter 'url("/' 'url("/admin/';
            sub_filter '"/static/' '"/admin/static/';
            sub_filter '"/browser/' '"/admin/browser/';
            sub_filter '"/login' '"/admin/login';
            sub_filter '"/logout' '"/admin/logout';
            sub_filter_once off;

            # pgAdmin specific settings
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Frontend (all other requests)
        location / {
            # Proxy to frontend
            proxy_pass http://allowance_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Frontend specific settings
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "Allowance service is healthy\n";
            add_header Content-Type text/plain;
        }

        # Default location for root path
        location = / {
            proxy_pass http://allowance_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

