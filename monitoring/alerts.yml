groups:
  - name: allowance-server
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        annotations:
          summary: "High error rate detected"
          description: "Error rate {{ $value | humanizePercentage }} is above 5%"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, http_request_duration_seconds) > 1
        for: 5m
        annotations:
          summary: "High response time"
          description: "P95 response time {{ $value }}s is above 1s"

      - alert: DatabaseConnectionPoolExhausted
        expr: db_pool_available_connections < 1
        for: 1m
        annotations:
          summary: "Database connection pool exhausted"
          description: "No available connections in pool"

      - alert: ServerDown
        expr: up{job="allowance-server"} == 0
        for: 1m
        annotations:
          summary: "Server is down"
          description: "Allowance server has been unreachable for 1 minute"

  - name: postgres
    interval: 30s
    rules:
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL has been unreachable for 1 minute"

      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count > 90
        for: 5m
        annotations:
          summary: "High database connections"
          description: "{{ $value }} connections, approaching max of 100"
