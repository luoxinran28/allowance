global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'allowance-production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'allowance-server'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:3000']
    scrape_interval: 5s

  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:9187']
    scrape_interval: 5s

  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 5s
