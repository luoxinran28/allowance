services:
  nginx:
    image: nginx:alpine
    ports:
      - "8.218.151.90:80:80"
      - "8.218.151.90:443:443"
    volumes:
      # Use the generated config from the host
      - /var/www/minerbond/deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount certs so nginx can read /ssl/minerbond.pem/key
      - /ssl:/ssl:ro
      # Serve uploads path if referenced by nginx
      - /var/www/minerbond/uploads:/var/www/minerbond/uploads:ro
      # 注意：不再挂载 .next/static，由 frontend 容器直接处理
    restart: always
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.prod
    env_file:
      - ./frontend/.env.production
    volumes:
      - ./uploads:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - ./backend/.env.production
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
