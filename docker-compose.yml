services:
  postgres:
    image: postgres:15-alpine
    container_name: allowance-postgres
    environment:
      POSTGRES_DB: allowance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d allowance"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: allowance-server
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=4040
      - DATABASE_URL=postgres://postgres:password@postgres:5432/allowance
      - JWT_SECRET=fake-jwt-secret-for-testing-123456789012345678901234567890
      - JWT_EXPIRATION_HOURS=24
      - REFRESH_TOKEN_EXPIRATION_DAYS=7
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=your-email@gmail.com
      - SMTP_PASSWORD=your-app-password
      - EMAIL_FROM=noreply@allowance.com
      - FRONTEND_URL=http://localhost:3030
      - ACTIVATION_TOKEN_EXPIRATION_HOURS=24
      - PASSWORD_RESET_TOKEN_EXPIRATION_HOURS=1
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
    ports:
      - "4040:4040"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4040/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: allowance-client
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4040
      - NEXT_PUBLIC_FRONTEND_URL=http://localhost:3030
    ports:
      - "3030:3030"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data: