services:
  postgres:
    image: postgres:15-alpine
    container_name: allowance-postgres
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-allowance}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d allowance"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: allowance-server
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "4040:4040"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:4040/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
        - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmjs.org/}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL}
        - NEXT_PUBLIC_API_SECRET=${NEXT_PUBLIC_API_SECRET}
        - NEXT_PUBLIC_PRODUCT_SLUG=${NEXT_PUBLIC_PRODUCT_SLUG}
      network: host
    container_name: allowance-client
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4040}
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:3030}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "3030:3030"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data: