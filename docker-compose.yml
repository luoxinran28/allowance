services:
  postgres:
    image: postgres:15-alpine
    container_name: allowance-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-allowance}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d allowance"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: allowance-server
    environment:
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - SERVER_PORT=${SERVER_PORT:-4040}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:password@postgres:5432/allowance}
      - JWT_SECRET=${JWT_SECRET:-fake-jwt-secret-for-testing-123456789012345678901234567890}
      - API_SECRET=${API_SECRET:-50f63a0a9cd856c0ca06dcdd839a45e7983888a8fedc1e703dddc8865464aab6}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-24}
      - REFRESH_TOKEN_EXPIRATION_DAYS=${REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-your-email@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-your-password}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@allowance.com}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3030}
      - ACTIVATION_TOKEN_EXPIRATION_HOURS=${ACTIVATION_TOKEN_EXPIRATION_HOURS:-24}
      - PASSWORD_RESET_TOKEN_EXPIRATION_HOURS=${PASSWORD_RESET_TOKEN_EXPIRATION_HOURS:-1}
      - RUST_LOG=${RUST_LOG:-debug}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-1}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "4040:4040"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:4040/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
        - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmjs.org/}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL}
        - NEXT_PUBLIC_API_SECRET=${NEXT_PUBLIC_API_SECRET}
        - NEXT_PUBLIC_PRODUCT_SLUG=${NEXT_PUBLIC_PRODUCT_SLUG}
      network: host
    container_name: allowance-client
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4040}
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:3030}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "3030:3030"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data: