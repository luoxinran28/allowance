# ========================================
# Allowance Authorization System
# Production Docker Compose Configuration
# ========================================
# Purpose: Production deployment with optimized settings
# Usage: docker-compose -f docker-compose.prod.yml up -d
# Note: Environment variables loaded from server/.env and client/.env files
# ========================================

services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:15-alpine
    container_name: allowance-postgres
    restart: always
    env_file:
      - ./database/.env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-allowance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allowance-network
    # Security: PostgreSQL only accessible from within network
    expose:
      - "5432"

  # Rust Axum Backend Server (Production)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: allowance-server:latest
    container_name: allowance-server
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "4040:4040"
    expose:
      - "4040"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4040/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - allowance-network
    # Security: Only expose through reverse proxy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  # Next.js Frontend Client (Production)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: allowance-client:latest
    container_name: allowance-client
    restart: always
    env_file:
      - ./client/.env
    ports:
      - "3030:3030"
    expose:
      - "3030"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - allowance-network
    # Security: Only expose through reverse proxy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  # pgAdmin 4 - Database Management Tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: allowance-pgadmin
    restart: always
    env_file:
      - ./database/.env
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - allowance-network
    # Security: Database admin access
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

# ========================================
# Network Configuration (Internal-only)
# ========================================
networks:
  allowance-network:
    driver: bridge

# ========================================
# Volume Configuration (Data Persistence)
# ========================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
