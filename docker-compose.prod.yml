# ========================================
# Allowance Authorization System
# Production Docker Compose Configuration
# ========================================
# Purpose: Production deployment with optimized settings
# Usage: docker-compose -f docker-compose.prod.yml up -d
# Configuration: All services read from root .env file (not from subdirectories)
# ========================================

services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:15-alpine
    container_name: allowance-postgres
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-allow_Me2Pa3s}
      - POSTGRES_DB=${DB_NAME:-allowance}
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-allowance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allowance-network
    # Security: PostgreSQL only accessible from within network
    expose:
      - "5432"

  # Rust Axum Backend Server (Production)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: allowance-server:latest
    container_name: allowance-server
    restart: always
    env_file:
      - .env
    ports:
      - "4040:4040"
    expose:
      - "4040"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4040/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - allowance-network
    # Security: Only expose through reverse proxy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  # Next.js Frontend Client (Production)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
        - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmmirror.com/}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL}
        - NEXT_PUBLIC_API_SECRET=${NEXT_PUBLIC_API_SECRET}
        - NEXT_PUBLIC_PRODUCT_SLUG=${NEXT_PUBLIC_PRODUCT_SLUG:-allowance}
      # Build with increased shared memory for Next.js
      shm_size: 4gb
    image: allowance-client:latest
    container_name: allowance-client
    restart: always
    env_file:
      - .env
    ports:
      - "3030:3030"
    expose:
      - "3030"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - allowance-network
    # Security: Only expose through reverse proxy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  # pgAdmin 4 - Database Management Tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: allowance-pgadmin
    restart: always
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@allowance.local}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-pgadmin_password}
      - PGADMIN_CONFIG_SERVER_MODE=${PGADMIN_CONFIG_SERVER_MODE:-False}
      - SCRIPT_NAME=/pgadmin
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - allowance-network
    # Security: Database admin access
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Nginx Reverse Proxy (在服务器上映射到80和443)
  nginx:
    image: nginx:alpine
    container_name: allowance-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/ssl:/etc/nginx/ssl:ro  # Uncomment when SSL certificates are available
    depends_on:
      - server
      - client
    networks:
      - allowance-network

# ========================================
# Network Configuration (Internal-only)
# ========================================
networks:
  allowance-network:
    driver: bridge

# ========================================
# Volume Configuration (Data Persistence)
# ========================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
