# ========================================
# Allowance Authorization System (47.82.64.35)
# Production Docker Compose Configuration
# ========================================
# Purpose: Production deployment - Central Auth Server
# Usage: docker-compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
# 1. Copy server/.env.production to server/.env
# 2. Copy client/.env.production to client/.env
# 3. Copy database/.env.production to database/.env
# 4. Update all secrets with real production values
#
# Server: 47.82.64.35
# Provides auth for: KwongFu on 47.79.78.229
# ========================================

services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:15-alpine
    container_name: allowance-postgres
    restart: always
    env_file:
      - ./database/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-allowance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - allowance-network

  # Rust Axum Backend Server (Production)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: allowance-server:latest
    container_name: allowance-server
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "4040:4040"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4040/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - allowance-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  # Next.js Frontend Client (Production)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Build-time variables for Next.js (embedded at build)
        - NEXT_PUBLIC_API_URL=http://47.82.64.35:4040
        - NEXT_PUBLIC_FRONTEND_URL=http://47.82.64.35:3030
    image: allowance-client:latest
    container_name: allowance-client
    restart: always
    env_file:
      - ./client/.env
    ports:
      - "3030:3030"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - allowance-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

# ========================================
# Network Configuration
# ========================================
networks:
  allowance-network:
    driver: bridge

# ========================================
# Volume Configuration
# ========================================
volumes:
  postgres_data:
    driver: local
